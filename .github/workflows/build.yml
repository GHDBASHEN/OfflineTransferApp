name: Build Windows Application

# This workflow runs when you push to the main branch or click "Run workflow"
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    # MUST run on Windows to generate a valid .exe file
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask qrcode pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --name "OfflineTransfer" --add-data "templates;templates" app.py

    - name: Upload Artifact (The EXE file)
      uses: actions/upload-artifact@v4
      with:
        name: OfflineTransfer-App
        path: dist/OfflineTransfer.exe