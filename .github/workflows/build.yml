name: Build and Release Windows Application

# Trigger the workflow when pushing a tag like 'v1.0.0' or manually
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

# Grant the pipeline permission to create a release
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask qrcode pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --name "OfflineTransfer" --add-data "templates;templates" app.py

    - name: Upload Artifact (For manual runs)
      uses: actions/upload-artifact@v4
      with:
        name: OfflineTransfer-App
        path: dist/OfflineTransfer.exe

    - name: Create Release and Upload Asset
      # This step only runs if a version tag was pushed
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/OfflineTransfer.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}